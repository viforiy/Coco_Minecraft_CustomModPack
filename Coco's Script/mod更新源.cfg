# Coco 整合包 Mod 更新源配置
# 由 一键部署.bat 生成, 手工改完下次运行自动生效
# 以 # 开头的行会被忽略, 等号后面不要留多余空格
# 本文件跟脚本放在一起(Coco's Script\mod更新源.cfg); 放在整合包根目录也一样会被读到
# 元数据仓地址, 必须是 packwiz 规范仓库, 根目录要有 pack.toml
PACK_GIT_URL=https://github.com/viforiy/Coco_Minecraft_CustomModPack.git
# 分支名
PACK_GIT_BRANCH=main
# 同步方式 auto 优先用 git, 没装 git 时自动改用 zip 压缩包
META_SOURCE=auto
# 以下为可选项, 需要时去掉行首的 # 再用
#PACK_SOURCE=file
#PROXY_PORT=7890
#BACKUP_MODS=0
#FAIL_HARD=0

# 前置裁剪, 见 [客户端]mod前置裁剪脚本.bat, 默认按清单裁剪客户端模组
# 0 = 整步跳过前置裁剪
#PRE_TRIM=1
# 1 = 裁剪失败就中止本次更新, 0 = 只告警照常装
#PRE_FAIL_HARD=0
# 一次最多裁几个, 0 = 不限制(超过总数 90% 也会被拦)
#PRE_MAX_TRIM=0
# 清单文件后缀, default = [客户端]模组裁剪清单.txt, 其它值 = [客户端]模组裁剪清单.名字.txt
#PRE_PROFILE=default
# blacklist = 只裁清单里 - 的行, whitelist = 仅客户端模组只留 + 的行
#PRE_TRIM_MODE=blacklist
# 0 = 只删元数据, 不动 mods 里已有的 jar
#PRE_TOUCH_MODS=1